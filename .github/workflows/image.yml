name: Image

# The VM has 1 GiB of RAM, which is not enough to run next build, so the image
# is built here and the server only pulls it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The unit tests mock the database, so they need nothing but Node. An image
  # is only built and published once they, the db and the e2e tests pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LayoutProps and the other route types are generated, not checked in.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  # The SQL against real Hamilton data, rebuilt from the import's raw tables
  # by scripts/test-db.sh, on the same Postgres, PostGIS and pgRouting the
  # server runs.
  db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          docker run -d --name walkreach-db -p 5433:5432
          -e POSTGRES_USER=walkreach -e POSTGRES_PASSWORD=walkreach -e POSTGRES_DB=walkreach
          pgrouting/pgrouting:17-3.5-3.7.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: gh release download test-data --pattern walkreach-test.dump
        env:
          GH_TOKEN: ${{ github.token }}
      # Over TCP: the server the image starts while it initialises listens on
      # its socket only, and is restarted once that is done.
      - run: until docker exec walkreach-db pg_isready -h 127.0.0.1 -U walkreach; do sleep 1; done
      - run: ./scripts/test-db.sh walkreach-test.dump
      - run: npm run test:db
        env:
          DATABASE_URL: postgresql://walkreach:walkreach@localhost:5433/walkreach_test

  # The production build in Chromium, at desktop and phone size, laid out as
  # the Dockerfile does and over the same database the db job builds.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >
          docker run -d --name walkreach-db -p 5433:5432
          -e POSTGRES_USER=walkreach -e POSTGRES_PASSWORD=walkreach -e POSTGRES_DB=walkreach
          pgrouting/pgrouting:17-3.5-3.7.3
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: gh release download test-data --pattern walkreach-test.dump
        env:
          GH_TOKEN: ${{ github.token }}
      - run: until docker exec walkreach-db pg_isready -h 127.0.0.1 -U walkreach; do sleep 1; done
      - run: ./scripts/test-db.sh walkreach-test.dump
      - run: npm run build
      - run: |
          cp -r .next/static .next/standalone/.next/
          cp -r public .next/standalone/
      # Started before Playwright, which then reuses it rather than starting
      # next dev. HOSTNAME is the runner's name otherwise, and server.js
      # listens on it.
      - run: |
          node .next/standalone/server.js &
          until curl -sf http://localhost:3100/api/health; do sleep 1; done
          npx playwright test
        env:
          PORT: 3100
          HOSTNAME: 127.0.0.1
          DATABASE_URL: postgresql://walkreach:walkreach@localhost:5433/walkreach_test
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/

  build:
    needs: [test, db, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/derekdiliu/walkreach:latest
            ghcr.io/derekdiliu/walkreach:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
