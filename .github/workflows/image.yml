name: Image

# The VM has 1 GiB of RAM, which is not enough to run next build, so the image
# is built here and the server only pulls it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # The unit tests mock the database, so they need nothing but Node. An image
  # is only built and published once they pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # LayoutProps and the other route types are generated, not checked in.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/derekdiliu/walkreach:latest
            ghcr.io/derekdiliu/walkreach:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
