name: Image

# The VM has 1 GiB of RAM, which is not enough to run next build, so the image
# is built here and the server only pulls it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/derekdiliu/walkreach:latest
            ghcr.io/derekdiliu/walkreach:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
